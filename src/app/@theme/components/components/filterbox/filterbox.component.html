<div class="filter-block">
    <div class="filter-header">
        <ul>
            <li><a (click)="searchType='quick'">Search</a></li>
            <li><a (click)="searchType='advance'">Filter</a></li>
        </ul>
    </div>
    <div class="quick-search" *ngIf="searchType=='quick'">
        <div class="form-group">
            <input type="text" class="form-control" placeholder="Quick Search">
        </div>
    </div>
    <div class="advance-search" *ngIf="searchType=='advance'">

        <div class="filter-feilds">
            <div class="form-group">
                <label>Date Range</label>
                <input type="text" class="form-control" placeholder="Select Date Range">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select class="form-control">
                    <option value="1">Draft</option>
                    <option value="2">Submitted</option>
                </select>
            </div>
        </div>
        <div class="action-button">
            <button type="button" class="btn-apply searching" id="applyFilter" title="Apply Search">
                <i class="ri-search-2-line"></i> Search</button>
            <button type="button" class="btn-reset" id="resetFilter" title="Reset Filter">
                <i class="ri-refresh-line"></i></button>
        </div>
    </div>
</div>
